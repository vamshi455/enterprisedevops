<title>Release Live Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: control bar (gate, deployment type, style, play) → swimlane canvas (stages left→right, lanes top→bottom) → gate explainer + "inside a deployment" sub-flow → floating definitions panel bottom-right. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --sunk:#e8edf1; --ink:#14202b; --muted:#566473; --line:#d3dae2; --grid:#e3e8ee;
  --accent:#0d6970; --accent-ink:#fff; --accent-soft:#dcefef;
  --lane:#f7f9fb; --lane-alt:#eff3f6; --stage:#ffffff;
  --dev:#2563a8; --auto:#0d6970; --ppl:#8a4fb8; --env:#b5541c;
  --ok:#2a7a4e; --ok-bg:#e1f2e7; --warn:#a46510; --warn-bg:#fbefd9; --bad:#b53131; --bad-bg:#f8e2e2;
  --edge:#8a99a8; --token:#e0761a;
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151f29; --sunk:#1c2834; --ink:#e3eaf1; --muted:#93a2b1; --line:#2a3744; --grid:#1f2b37;
  --accent:#4cb2b9; --accent-ink:#06181a; --accent-soft:#16343a; --lane:#121b24; --lane-alt:#16212c; --stage:#151f29;
  --dev:#6aa6ec; --auto:#4cb2b9; --ppl:#c08ff0; --env:#ee8a52;
  --ok:#5cc28a; --ok-bg:#163223; --warn:#e2a94b; --warn-bg:#352914; --bad:#f07979; --bad-bg:#3a1b1d;
  --edge:#5f7183; --token:#ffb052; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151f29; --sunk:#1c2834; --ink:#e3eaf1; --muted:#93a2b1; --line:#2a3744; --grid:#1f2b37;
  --accent:#4cb2b9; --accent-ink:#06181a; --accent-soft:#16343a; --lane:#121b24; --lane-alt:#16212c; --stage:#151f29;
  --dev:#6aa6ec; --auto:#4cb2b9; --ppl:#c08ff0; --env:#ee8a52;
  --ok:#5cc28a; --ok-bg:#163223; --warn:#e2a94b; --warn-bg:#352914; --bad:#f07979; --bad-bg:#3a1b1d;
  --edge:#5f7183; --token:#ffb052; color-scheme:dark}
/* style presets (chosen in the Style dropdown) */
:root[data-style="blueprint"]{
  --bg:#0c2340; --surface:#10305a; --sunk:#14396a; --ink:#e6f0ff; --muted:#9db5d8; --line:#2f5a8f; --grid:#173f70;
  --accent:#7cc4ff; --accent-ink:#06223f; --accent-soft:#1a4677; --lane:#0f2b50; --lane-alt:#12325c; --stage:#10305a;
  --dev:#9fd0ff; --auto:#7ce3d6; --ppl:#d0b0ff; --env:#ffc38a; --edge:#5f86b8; --token:#ffd166;
  --ok:#7fe0a8; --ok-bg:#174a3a; --warn:#ffd166; --warn-bg:#4a3d17; --bad:#ff9b9b; --bad-bg:#4a1d24; color-scheme:dark}
:root[data-style="contrast"]{
  --bg:#ffffff; --surface:#ffffff; --sunk:#f0f0f0; --ink:#000000; --muted:#333333; --line:#000000; --grid:#dddddd;
  --accent:#0047b3; --accent-ink:#fff; --accent-soft:#e0ebff; --lane:#ffffff; --lane-alt:#f5f5f5; --stage:#ffffff;
  --dev:#0047b3; --auto:#006b3c; --ppl:#6a1b9a; --env:#a33b00; --edge:#000000; --token:#d10000;
  --ok:#006b3c; --ok-bg:#e3f5ea; --warn:#8a4b00; --warn-bg:#fff0d6; --bad:#b00000; --bad-bg:#ffe3e3; color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1560px;margin:0 auto;display:grid;gap:10px}
.wrap>*{min-width:0}
.eb{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);margin:4px 0 0;max-width:80ch}
.mono{font-family:var(--f-mono);font-size:.86em}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.controls h1{font-size:17px;margin-right:6px;white-space:nowrap}
.controls select{min-width:0;padding:5px 8px;font-size:14px}
.btn.sm{padding:5px 10px;font-size:14px}
.tog{display:flex;gap:5px;align-items:center;font-size:14px;font-weight:600;padding:0 4px}
.ctl{display:grid;gap:4px}
.ctl label{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:150px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.spacer{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* canvas */
.canvas{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;position:relative}
svg#flow{display:block;width:100%;min-width:1180px;height:auto}
.lane-bg{fill:var(--lane)} .lane-bg.alt{fill:var(--lane-alt)}
.lane-label{font-family:var(--f-display);font-weight:700;font-size:13px;fill:var(--ink)}
.lane-sub{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.stage-head{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;fill:var(--muted)}
.stage-title{font-family:var(--f-display);font-weight:700;font-size:13.5px;fill:var(--ink)}
.stage-col{fill:transparent}
.stage-col.sel{fill:var(--accent-soft);opacity:.55}
.gridline{stroke:var(--grid);stroke-width:1}
.edge{fill:none;stroke:var(--edge);stroke-width:1.6;transition:opacity .25s}
.edge.on{stroke:var(--accent);stroke-width:2.2}
.edge.dim{opacity:.18}
.node{cursor:pointer;transition:opacity .25s}
.node rect.box{fill:var(--surface);stroke-width:1.6;rx:9}
.node .bar{rx:2}
.node text.t{font-family:var(--f-display);font-weight:700;font-size:12.5px;fill:var(--ink)}
.node text.s{font-family:var(--f-body);font-size:10.8px;fill:var(--muted)}
.node.dim{opacity:.22}
.node.active rect.box{stroke-width:3}
.node:hover rect.box,.node:focus rect.box{stroke-width:2.6}
.node:focus{outline:none}
.node .gate-chip{font-family:var(--f-mono);font-size:9.5px;font-weight:600}
.token{fill:var(--token);filter:drop-shadow(0 0 4px var(--token))}
.pulse{fill:none;stroke:var(--token);stroke-width:2;opacity:0}

/* tooltip */
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:6px;padding:7px 10px;font-size:12.5px;max-width:300px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tip b{display:block;font-family:var(--f-display);font-size:13px;margin-bottom:2px}

/* popup (draggable) */
.pop{position:fixed;z-index:40;width:min(440px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.28);display:grid;max-height:min(78vh,640px)}
.pop-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none;border-radius:12px 12px 0 0;background:var(--sunk)}
.pop-h:active{cursor:grabbing}
.pop-h .grip{font-family:var(--f-mono);color:var(--muted);letter-spacing:-2px}
.pop-h h3{flex:1}
.pop-b{padding:12px 14px;overflow:auto;display:grid;gap:10px;font-size:14px}
.pop-b ul{margin:0;padding-left:18px} .pop-b li{margin:3px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.x{border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 6px}
.pill{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;display:inline-block;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}

/* explainer + inside */
.below{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px}
@media (max-width:1000px){.below{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.panel ol,.panel ul{margin:0;padding-left:20px} .panel li{margin:3px 0}
.who{display:flex;gap:6px;flex-wrap:wrap}
.steps{display:flex;gap:0;flex-wrap:wrap;align-items:stretch}
.step{flex:1 1 150px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:4px;background:var(--lane);position:relative;transition:background .3s,border-color .3s}
.step .n{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.step b{display:block;font-family:var(--f-display);font-size:13.5px}
.step span.d{font-size:12.5px;color:var(--muted)}
.step.now{background:var(--warn-bg);border-color:var(--warn)}
.step.done{background:var(--ok-bg);border-color:var(--ok)}
abbr.g{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}

/* definitions panel (bottom-right) */
.defs{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;display:grid;justify-items:end;gap:8px}
.defs-btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.defs-panel{width:min(400px,calc(100vw - 32px));max-height:min(62vh,560px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.28);display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
.defs-panel header{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk)}
.defs-panel header h3{flex:1}
.defs-panel input{margin:10px 12px 4px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;font:inherit;color:inherit}
.defs-list{overflow:auto;padding:4px 12px 12px;display:grid;gap:8px}
.def{border-bottom:1px solid var(--line);padding-bottom:8px}
.def b{font-family:var(--f-display);font-size:14px}
.def p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.rbadge{cursor:pointer}
.rbadge circle{fill:var(--bad);stroke:var(--surface);stroke-width:2}
.rbadge text{font-family:var(--f-mono);font-size:10px;font-weight:700;fill:#fff;text-anchor:middle}
.risks-off .rbadge{display:none}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.risk{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:10px 12px;display:grid;gap:6px;background:var(--lane);font-size:13.5px}
.risk h3{font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.risk .rid{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.risk dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
.risk dt{font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
.risk dd{margin:0} .risk ul{margin:0;padding-left:16px}
.pill.open{background:var(--bad-bg);color:var(--bad)} .pill.prop{background:var(--warn-bg);color:var(--warn)} .pill.dec{background:var(--ok-bg);color:var(--ok)}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:900px){.twocol{grid-template-columns:1fr}}
table.w{width:100%;border-collapse:collapse;font-size:13.5px} table.w th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:5px;border-bottom:1px solid var(--line)} table.w td{padding:6px 5px;border-bottom:1px solid var(--line);vertical-align:top}
.rfilter{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="controls" role="group" aria-label="View options">
    <h1>Release Live Flow</h1>
    <select id="gateSel" aria-label="Gate"></select>
    <select id="typeSel" aria-label="Deployment type"><option value="all">All three</option><option value="adf">ADF only</option><option value="dbx">Databricks only</option><option value="sql">Azure SQL DB only</option></select>
    <select id="styleSel" aria-label="Style"><option value="classic">Classic</option><option value="blueprint">Blueprint</option><option value="contrast">High contrast</option></select>
    <select id="speedSel" aria-label="Speed"><option value="0.6">Slow</option><option value="1" selected>Normal</option><option value="1.8">Fast</option></select>
    <label class="tog"><input type="checkbox" id="riskTog" checked> Risks</label>
    <button class="btn ghost sm" id="prevBtn" title="Previous gate" aria-label="Previous gate">◀</button>
    <button class="btn ghost sm" id="nextBtn" title="Next gate" aria-label="Next gate">▶</button>
    <button class="btn sm" id="playBtn">Pause</button>
    <button class="btn ghost sm" id="tourBtn">Tour</button>
  </div>

  <div class="canvas"><svg id="flow" role="img" aria-label="Release flow swimlane diagram"></svg></div>

  <div class="below">
    <section class="panel" aria-live="polite" id="explain"></section>
    <section class="panel" id="inside"></section>
  </div>
  <section class="panel" id="risks"></section>
</div>

<div class="tip" id="tip" hidden></div>
<div class="pop" id="pop" hidden role="dialog" aria-labelledby="popTitle">
  <div class="pop-h" id="popHead"><span class="grip" aria-hidden="true">⋮⋮</span><h3 id="popTitle"></h3><button class="x" id="popClose" aria-label="Close">×</button></div>
  <div class="pop-b" id="popBody"></div>
</div>
<div class="defs">
  <div class="defs-panel" id="defsPanel" hidden>
    <header><h3>Definitions</h3><button class="x" id="defsClose" aria-label="Close definitions">×</button></header>
    <input type="text" id="defsSearch" placeholder="Search a term (e.g. squash)" aria-label="Search definitions">
    <div class="defs-list" id="defsList"></div>
  </div>
  <button class="defs-btn" id="defsBtn" aria-expanded="false" aria-controls="defsPanel">Definitions</button>
</div>

<script>
(() => {
/* ============ glossary ============ */
const DEFS = [
 ["PR (pull request)","A request to merge a branch into main. It carries the story link, test evidence and notes, and is where review and checks happen."],
 ["Squash merge","Merging a PR as ONE single commit on main, however many commits the branch had. One PR = one commit = one story, which is what lets a release pick PRs cleanly."],
 ["Cherry-pick","Copying a specific commit onto another branch. The release cut cherry-picks each listed PR's squash commit onto the last PROD tag."],
 ["main","The integration branch. Every approved PR lands here and deploys to DEV. main is not a release; only listed PRs move to QA, UAT and PROD."],
 ["Feature branch","A developer's own branch (feature/AB#<story>-…) where the change is built and fully tested before a PR."],
 ["Gate","A checkpoint a change must pass to move forward: automated checks, a person's approval, or both."],
 ["AB# (Azure Boards link)","Writing AB#5710 in a PR links it to story 5710 in Azure Boards, so every change is traceable to a story."],
 ["CODEOWNERS","A GitHub file naming who must review which folders. Here it makes the tech lead a required reviewer."],
 ["Feature-Test-Run","The ADF debug run ID the developer pastes in the PR. The PR check asks ADF whether that run succeeded."],
 ["Feature DB (copy)","sqldb-etlcfg-ft-<story>: a short-lived copy of the DEV config database plus the branch's scripts, used only to test that branch. Dropped when the PR closes."],
 ["Elastic pool","A shared, capped pool of database capacity on the DEV SQL server that all feature DB copies live in, to control cost."],
 ["Release cut","Turning a list of PR numbers into a release branch (release/<id>) by cherry-picking their squash commits onto the last PROD tag."],
 ["Release queue","Only one release can be in progress (from cut until it reaches PROD or is dropped). A new cut is refused while one is in progress."],
 ["Preview (confirm=false)","A dry run of the cut that lists each PR's title, story, author and files without cutting anything. Catches mistyped PR numbers."],
 ["Manifest","releases/<id>/manifest.json: the record of exactly which PRs, stories and commits are in a release, and its baseline."],
 ["Baseline / PROD tag","prod/<id> is the git tag on what is currently in PROD. The next release starts from it, so PROD never goes backwards."],
 ["Build once, deploy many","The release is built a single time; QA, UAT and PROD all receive that identical build."],
 ["GitHub Environment approval","A pause in a workflow until named reviewers click 'Review deployments' and approve. Used for UAT (QA lead) and PROD (release manager)."],
 ["OIDC / federated credential","How GitHub signs in to Azure without stored passwords: a short-lived token is exchanged for a user-assigned managed identity."],
 ["Managed identity","An Azure identity for a service or pipeline instead of a person. It must be user-assigned for GitHub to use it."],
 ["DACPAC","A packaged definition of a SQL database's schema, built from the SQL project. sqlpackage compares it with the target and applies only the differences."],
 ["sqlpackage","Microsoft's tool that publishes a DACPAC to a database: compare, generate the change script, run pre-deploy, schema changes, then post-deploy."],
 ["BlockOnPossibleDataLoss","A sqlpackage safety setting: the deployment stops if a change could delete data (dropping a column or table)."],
 ["SQLCMD variable","A placeholder like $(SourceServer) in a SQL script, filled with the right value per environment at deploy time (from settings/<env>.json)."],
 ["Post-deployment script","SQL that runs after the schema is updated. Here it applies the config rows with MERGE statements."],
 ["MERGE (idempotent)","A SQL statement that inserts a config row if missing or updates it if present. Running it twice gives the same result."],
 ["Idempotent","Safe to run again: repeating it doesn't change the outcome or create duplicates."],
 ["Runtime tables / watermark","Tables the pipelines write while running (e.g. the last loaded timestamp). Their schema is deployed, their rows never are."],
 ["settings/<env>.json","One file per environment in Git holding values that differ per environment (source servers, storage, catalogs). No secrets."],
 ["Key Vault","Azure's secret store. Passwords and keys live here, never in Git or settings files."],
 ["ARM template","The JSON deployment file ADF exports. Deploying it to a factory creates or updates pipelines, datasets and linked services."],
 ["ADF Git mode / Debug run","The DEV factory is connected to GitHub so a developer can open their branch and run a pipeline in Debug without publishing it."],
 ["Integration runtime (IR)","The compute ADF uses to move data; self-hosted IRs reach on-premises or private sources."],
 ["Databricks Asset Bundle (DAB)","A folder of Databricks jobs, notebooks and settings deployed with 'databricks bundle deploy -t <env>'."],
 ["Development mode","A bundle target setting that gives each developer their own prefixed copy of jobs, so testing doesn't collide."],
 ["Unity Catalog (UC)","Databricks' catalog of tables, schemas and permissions; each environment has its own catalog."],
 ["CR (change request)","The ServiceNow record approving a PROD change. Raised and checked by hand here (no integration)."],
 ["CHG number","The ServiceNow change request ID (e.g. CHG0034567) entered when starting the PROD deploy."],
 ["Change window","The approved time slot in which the PROD change may be made."],
 ["Drop release","Abandoning the release in progress (e.g. a story failed QA). Frees the queue; the passing PRs are cut again."],
 ["Fix forward","Correcting a bad PR with a new PR rather than undoing it."],
 ["Revert","A new PR that exactly undoes an earlier merged PR. Used only if a story is abandoned, DEV is broken, or another cut is blocked."],
 ["Drift","main moving ahead of PROD because merged PRs haven't been released yet."],
];

/* ============ model ============ */
const STAGES = [
 {id:"g0", head:"GATE 0", title:"Feature test", gate:"g0"},
 {id:"g1", head:"GATE 1", title:"Pull request", gate:"g1"},
 {id:"dev", head:"AUTOMATIC", title:"Merge → DEV", gate:"dev"},
 {id:"g2", head:"GATE 2", title:"Release cut", gate:"g2"},
 {id:"qa", head:"AUTOMATIC", title:"QA", gate:"qa"},
 {id:"g3", head:"GATE 3", title:"UAT", gate:"g3"},
 {id:"g4", head:"GATE 4", title:"Change request", gate:"g4"},
 {id:"g5", head:"GATE 5", title:"PROD", gate:"g5"},
];
const LANES = [
 {id:"dev", label:"Developer", sub:"builds, tests, cuts", color:"--dev"},
 {id:"auto", label:"GitHub Actions", sub:"automatic", color:"--auto"},
 {id:"ppl", label:"People", sub:"tech lead · QA · business · RM", color:"--ppl"},
 {id:"env", label:"Azure", sub:"where it runs", color:"--env"},
];
/* each node: id, stage index, lane index, title, sub{all,adf,dbx,sql}, tip, who, details{all,adf,dbx,sql}: array of bullets */
const N = [
 {id:"build", s:0, l:0, title:"Build on branch",
  sub:{all:"feature/AB#5710", adf:"pipeline JSON in adf/", dbx:"jobs + notebooks", sql:"tables + MERGE files"},

/* ============ geometry ============ */
const LW=150, SW=172, NW=142, NH=72, HEAD=62, LH=132;
const W = LW + STAGES.length*SW + 10, H = HEAD + LANES.length*LH + 12;
const nodeXY = n => ({x: LW + n.s*SW + (SW-NW)/2, y: HEAD + n.l*LH + (LH-NH)/2});
const byId = Object.fromEntries(N.map(n=>[n.id,n]));
function occupied(s,l){ return N.some(n=>n.s===s && n.l===l); }
function edgePath(a,b){
  const A=nodeXY(a), B=nodeXY(b);
  if(a.s===b.s){
    const down = b.l>a.l;
    let blocked=false; for(let l=Math.min(a.l,b.l)+1;l<Math.max(a.l,b.l);l++) if(occupied(a.s,l)) blocked=true;
    if(blocked){ // detour on the right side of the column
      const x1=A.x+NW, y1=A.y+NH/2, x2=B.x+NW, y2=B.y+NH/2, cx=x1+13;
      return `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;
    }
    const x=A.x+NW/2, y1= down? A.y+NH : A.y, y2 = down? B.y : B.y+NH;
    return `M${x},${y1} L${x},${y2}`;
  }
  const x1=A.x+NW, y1=A.y+NH/2, x2=B.x, y2=B.y+NH/2, dx=Math.max(30,(x2-x1)/2);
  return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
}

const svg=$("#flow");
function draw(){
  const NS="http://www.w3.org/2000/svg";
  let h=`<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>`;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  LANES.forEach((ln,i)=>{
    const y=HEAD+i*LH;
    h+=`<rect class="lane-bg ${i%2?"alt":""}" x="0" y="${y}" width="${W}" height="${LH}"/>`;
    h+=`<rect x="0" y="${y}" width="5" height="${LH}" fill="var(${ln.color})"/>`;
    h+=`<text class="lane-label" x="16" y="${y+LH/2-4}">${ln.label}</text><text class="lane-sub" x="16" y="${y+LH/2+13}">${ln.sub}</text>`;
  });
  STAGES.forEach((s,i)=>{
    const x=LW+i*SW;
    h+=`<rect class="stage-col" data-stage="${s.id}" x="${x}" y="0" width="${SW}" height="${H}"/>`;
    h+=`<line class="gridline" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;
    h+=`<text class="stage-head" x="${x+12}" y="24">${s.head}</text><text class="stage-title" x="${x+12}" y="44">${s.title}</text>`;
  });
  for(let i=0;i<PATH.length-1;i++){
    const a=byId[PATH[i]], b=byId[PATH[i+1]], k=`${a.id}>${b.id}`;
    h+=`<path class="edge" id="e_${i}" data-a="${a.id}" data-b="${b.id}" d="${edgePath(a,b)}" marker-end="url(#arr)"/>`;
  }
  N.forEach(n=>{
    const {x,y}=nodeXY(n), ln=LANES[n.l];
    h+=`<g class="node" id="n_${n.id}" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.title)}">
      <rect class="box" x="${x}" y="${y}" width="${NW}" height="${NH}" stroke="var(${ln.color})"/>
      <rect class="bar" x="${x}" y="${y}" width="5" height="${NH}" fill="var(${ln.color})"/>
      <text class="t" x="${x+13}" y="${y+24}">${esc(n.title)}</text>
      <text class="s" x="${x+13}" y="${y+42}" data-sub="1"></text>
      <text class="s" x="${x+13}" y="${y+58}" data-who="1">${esc(n.who.replace(/ \(.*\)$/,"").length>23?n.who.replace(/ \(.*\)$/,"").slice(0,22)+"…":n.who.replace(/ \(.*\)$/,""))}</text>
      <circle class="pulse" cx="${x+NW/2}" cy="${y+NH/2}" r="${NW/2}"/>
      <g class="rbadge" data-node="${n.id}" aria-hidden="true"><circle cx="${x+NW-2}" cy="${y+2}" r="9"/><text x="${x+NW-2}" y="${y+5.5}" data-cnt="1"></text></g></g>`;
  });
  h+=`<circle class="token" id="token" r="6" cx="-20" cy="-20"/>`;
  svg.innerHTML=h;
  // edge labels (after paths exist so we can measure)
  let lab="";
  for(let i=0;i<PATH.length-1;i++){
    const p=document.getElementById("e_"+i), L=p.getTotalLength(), m=p.getPointAtLength(L/2), k=`${PATH[i]}>${PATH[i+1]}`;
    const A_=byId[PATH[i]], B_=byId[PATH[i+1]], detour = A_.s===B_.s && Math.abs(A_.l-B_.l)>1;
    const txt=EDGE_LABEL[k]||""; if(!txt || L<70 || detour) continue;
    const w=txt.length*6.2+12;
    lab+=`<g class="elabel" data-e="${i}"><rect x="${m.x-w/2}" y="${m.y-9}" width="${w}" height="16" rx="8" fill="var(--surface)" stroke="var(--line)"/><text x="${m.x}" y="${m.y+3}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="var(--muted)">${txt}</text></g>`;
  }
  const g=document.createElementNS(NS,"g"); g.innerHTML=lab; svg.insertBefore(g, document.getElementById("n_build"));
}

function apply(){
  const gate=GATES.find(g=>g.id===st.gate), sel=new Set(gate.stages), all=st.gate==="all";
  document.querySelectorAll(".stage-col").forEach(r=>r.classList.toggle("sel", !all && sel.has(r.dataset.stage)));
  N.forEach(n=>{
    const el=document.getElementById("n_"+n.id), inGate = all || sel.has(STAGES[n.s].id);
    el.classList.toggle("dim", !inGate);
    el.querySelector("[data-sub]").textContent = n.sub[st.type] || n.sub.all;
  });
  for(let i=0;i<PATH.length-1;i++){
    const a=byId[PATH[i]], b=byId[PATH[i+1]], on = all || sel.has(STAGES[a.s].id) || sel.has(STAGES[b.s].id);
    const e=document.getElementById("e_"+i); e.classList.toggle("dim",!on);
    const lb=document.querySelector(`.elabel[data-e="${i}"]`); if(lb) lb.style.opacity = on?1:.2;
  }
  renderExplain(gate); renderInside(); renderRisks(gate); updateBadges();
  // restrict token loop to the gate's edges
  st.loop = edgesFor(gate); if(!st.loop.includes(st.idx)){ st.idx=st.loop[0]; st.t=0; }
}
function edgesFor(gate){
  if(gate.id==="all") return [...Array(PATH.length-1).keys()];
  const sel=new Set(gate.stages), out=[];
  for(let i=0;i<PATH.length-1;i++){ const a=byId[PATH[i]], b=byId[PATH[i+1]]; if(sel.has(STAGES[a.s].id) || (sel.has(STAGES[b.s].id))) out.push(i); }
  return out.length?out:[0];
}

const GL_TERMS=[["squash merge","Squash merge"],["squash","Squash merge"],["cherry-pick","Cherry-pick"],["CODEOWNER","CODEOWNERS"],["DACPAC","DACPAC"],["SQLCMD","SQLCMD variable"],["MERGE","MERGE (idempotent)"],["BlockOnPossibleDataLoss","BlockOnPossibleDataLoss"],["manifest","Manifest"],["queue","Release queue"],["ARM","ARM template"],["OIDC","OIDC / federated credential"],["watermarks","Runtime tables / watermark"],["CR","CR (change request)"],["AB#","AB# (Azure Boards link)"],["run ID","Feature-Test-Run"],["bundle","Databricks Asset Bundle (DAB)"],["development mode","Development mode"],["Unity Catalog","Unity Catalog (UC)"]];
function gloss(html){
  let out=html, used=new Set();
  for(const [term,key] of GL_TERMS){
    if(used.has(key)) continue;
    const re=new RegExp(`(^|[^\\w#>])(${term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})(?![\\w])`,"i");
    const def=DEFS.find(d=>d[0]===key); if(!def) continue;
    if(re.test(out)){ out=out.replace(re,(m,p,t)=>`${p}<abbr class="g" title="${esc(def[1])}">${t}</abbr>`); used.add(key); }
  }
  return out;
}

function riskHtmlForNode(id){

/* ============ animation ============ */
let last=0;
function frame(ts){
  const dt=Math.min(50, ts-(last||ts)); last=ts;
  if(st.playing){
    const p=document.getElementById("e_"+st.idx); if(p){
      const L=p.getTotalLength(); st.t += dt*0.12*st.speed;
      if(st.t>=L){ const k=st.loop.indexOf(st.idx); st.idx = st.loop[(k+1)%st.loop.length]; st.t=0; flash(byId[PATH[st.idx]]); }
      const pt=p.getPointAtLength(Math.min(st.t,L)); const tk=$("#token"); tk.setAttribute("cx",pt.x); tk.setAttribute("cy",pt.y);
      document.querySelectorAll(".edge.on").forEach(e=>e.classList.remove("on")); p.classList.add("on");
      document.querySelectorAll(".node.active").forEach(e=>e.classList.remove("active"));
      const tgt=document.getElementById("n_"+PATH[st.idx+1]); if(tgt) tgt.classList.add("active");
    }
  }
  requestAnimationFrame(frame);
}
function flash(n){ const c=document.querySelector(`#n_${n.id} .pulse`); if(!c||!c.animate) return; c.animate([{opacity:.7,transform:"scale(.6)"},{opacity:0,transform:"scale(1)"}],{duration:700,easing:"ease-out"}); c.style.transformOrigin="center"; c.style.transformBox="fill-box"; }

(function(){

  head.addEventListener("pointermove", e=>{ if(!drag) return; const x=Math.max(0,Math.min(innerWidth-60, ox+e.clientX-sx)), y=Math.max(0,Math.min(innerHeight-40, oy+e.clientY-sy)); pop.style.left=x+"px"; pop.style.top=y+"px"; pop.dataset.moved="1"; });
  const end=()=>{ drag=false; }; head.addEventListener("pointerup",end); head.addEventListener("pointercancel",end);
  head.addEventListener("keydown", e=>{ const step=e.shiftKey?40:12; const m={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[e.key]; if(!m) return; e.preventDefault(); pop.style.left=(pop.offsetLeft+m[0])+"px"; pop.style.top=(pop.offsetTop+m[1])+"px"; pop.dataset.moved="1"; });
